[package]
name = "musterschule_rs"
version = "0.1.0"
edition = "2024"

[dependencies]
rmcp = { version = "3.9.0", features = ["server", "transport-io", "macros"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "io-std"] }
